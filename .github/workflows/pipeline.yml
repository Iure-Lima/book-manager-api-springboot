name: Deploy Backend to Azure with MicroK8s

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}

      - name: Build and Push Docker Image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: 'true'
          tags: ${{ secrets.DOCKER_USERNAME }}/book-manager-backend:latest
          cache-from: type=gha
          cache-to: type=gha, mode=max

      - name: Deploy to Azure with MicroK8s using SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            microk8s kubectl rollout restart deployment/backend-deployment
            
            microk8s kubectl rollout status deployment/backend-deployment